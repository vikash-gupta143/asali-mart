<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>AsaliMart — Your Local Marketplace | Shop from Nearby Shops</title>
    <meta
      name="description"
      content="AsaliMart — India's local marketplace. Shop from nearby shops, get fast delivery, and bargain directly with sellers."
    />
    <meta
      name="keywords"
      content="local marketplace, nearby shops, online shopping india, delivery, bargaining, asalimart"
    />
    <meta name="author" content="AsaliMart" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://asalimart.com/" />

    <!-- Open Graph (Facebook, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AsaliMart — Your Local Marketplace" />
    <meta
      property="og:description"
      content="Shop from nearby local shops. Fast delivery, bargaining with sellers."
    />
    <meta property="og:url" content="https://asalimart.com" />
    <meta property="og:image" content="https://asalimart.com/og-image.png" />
    <meta property="og:site_name" content="AsaliMart" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AsaliMart — Local Marketplace" />
    <meta
      name="twitter:description"
      content="Shop from nearby local shops. Fast delivery."
    />
    <meta name="twitter:image" content="https://asalimart.com/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#FF6B00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AsaliMart" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
